name: Fix KURI RUSH safety

on:
  push:
    paths:
      - '.github/workflows/fix-kuri-rush-safety.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safety patch
        run: python3 .github/scripts/fix_rush_safety.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit safety fix
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html
          git commit -m "gameplay: make KURI RUSH fair and prevent surprise hits"
          git push
