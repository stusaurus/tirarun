name: Tune TiraKuri gameplay

on:
  push:
    paths:
      - '.github/workflows/tune-gameplay.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gameplay tuning
        run: python .github/scripts/tune_gameplay.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit tuned gameplay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git commit -m "gameplay: strengthen rush combo and high route rewards"
          git push
