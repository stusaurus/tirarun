name: Add FEVER exit grace

on:
  push:
    paths:
      - '.github/workflows/add-fever-exit-grace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FEVER exit grace
        run: python3 .github/scripts/add_fever_exit_grace.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit FEVER exit grace
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html
          git commit -m "gameplay: add invincibility after FEVER ends"
          git push
