name: Add meta progression

on:
  push:
    paths:
      - '.github/workflows/add-meta-progression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add meta progression
        run: python3 .github/scripts/add_meta_progression.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit meta progression
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html style.css
          git commit -m "feat: add item ranks user levels and gems"
          git push
