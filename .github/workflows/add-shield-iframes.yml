name: Add shield break invincibility

on:
  push:
    paths:
      - '.github/workflows/add-shield-iframes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shield invincibility patch
        run: python3 .github/scripts/add_shield_iframes.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit shield i-frames
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html
          git commit -m "gameplay: add invincibility after shield breaks"
          git push
