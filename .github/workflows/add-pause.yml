name: Add pause button

on:
  push:
    paths:
      - '.github/workflows/add-pause.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pause button
        run: python3 .github/scripts/add_pause.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit pause support
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html style.css
          git commit -m "feat: add pause and resume controls"
          git push
