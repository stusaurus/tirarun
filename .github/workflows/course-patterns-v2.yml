name: Course patterns v2

on:
  push:
    paths:
      - '.github/workflows/course-patterns-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply course-pattern patch
        run: python .github/scripts/course_patterns_v2.py
      - name: Check game syntax
        run: node --check game.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git diff --cached --quiet || git commit -m "feat: expand endless course patterns"
          git push
