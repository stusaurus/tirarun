name: Move pause button

on:
  push:
    paths:
      - '.github/workflows/move-pause-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pause button patch
        run: python .github/scripts/move_pause_button.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git diff --cached --quiet || git commit -m "ui: move pause button to bottom left"
          git push
