name: Inspect character assets

on:
  push:
    paths:
      - '.github/workflows/inspect-character-assets.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Inspect assets
        run: python .github/scripts/inspect_character_assets.py
