name: Pteran air control v2

on:
  push:
    paths:
      - '.github/workflows/pteran-air-control-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Pteran air-control v2 patch
        run: python .github/scripts/pteran_air_control_v2.py
      - name: Check game syntax
        run: node --check game.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html style.css
          git diff --cached --quiet || git commit -m "feat: add Pteran dive and reopen control"
          git push
