name: Add power effects

on:
  push:
    paths:
      - '.github/workflows/add-power-effects.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add power effects
        run: python3 .github/scripts/add_power_effects.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit power effects
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html
          git commit -m "effects: make powerups feel active"
          git push
