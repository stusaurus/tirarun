name: Refine fever and magnet

on:
  push:
    paths:
      - '.github/workflows/refine-fever-magnet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fever and magnet refinement
        run: python3 .github/scripts/refine_fever_magnet.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit refinement
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html
          git commit -m "gameplay: clarify FEVER and make magnet coin-only"
          git push

# one-shot rerun after patch-script repair
