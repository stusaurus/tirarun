name: Add Tiranon roar item

on:
  push:
    paths:
      - '.github/workflows/add-roar-item.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply roar item patch
        run: python3 .github/scripts/add_roar_item.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit roar item
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html
          git commit -m "gameplay: add Tiranon roar powerup"
          git push
