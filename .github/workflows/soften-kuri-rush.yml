name: Soften KURI RUSH

on:
  push:
    paths:
      - '.github/workflows/soften-kuri-rush.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make KURI RUSH fair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game.js')
          s = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              s = s.replace(old, new, 1)

          rep("""    const eventBoost = eventMode === 'rush' ? 48 : eventMode === 'bonus' ? 12 : 0;
    return Math.min(555, 275 + distance * .0062 + (player.fever > 0 ? 25 : 0) + eventBoost);
""", """    const eventBoost = eventMode === 'rush' ? 20 : eventMode === 'bonus' ? 12 : 0;
    return Math.min(540, 275 + distance * .0062 + (player.fever > 0 ? 25 : 0) + eventBoost);
""", 'rush speed')

          old_rush = """  function spawnRushPattern() {
    const x = W + 70;
    const kind = Math.floor(Math.random() * 5);
    if (kind === 0) {
      addChestnut(x, groundY - 33, .86);
      addChestnut(x + 68, groundY - 37, 1.02);
      addChestnut(x + 142, groundY - 33, .88);
      addChestnut(x + 214, groundY - 39, 1.06);
    } else if (kind === 1) {
      addChestnut(x, groundY - 33, .9);
      addChestnut(x + 90, groundY - 50, 1.22);
      addChestnut(x + 188, groundY - 33, .92);
    } else if (kind === 2) {
      addPlatform(x + 42, groundY - 82, 150);
      addChestnut(x, groundY - 33, .86);
      addChestnut(x + 92, groundY - 116, .88);
      addChestnut(x + 205, groundY - 34, 1.0);
    } else if (kind === 3) {
      addChestnut(x, groundY - 33, .84);
      addChestnut(x + 72, groundY - 33, .84);
      addChestnut(x + 168, groundY - 42, 1.10);
      addChestnut(x + 252, groundY - 33, .86);
    } else {
      addChestnut(x, groundY - 34, 1.0);
      addChestnut(x + 104, groundY - 34, .88);
      addChestnut(x + 194, groundY - 55, 1.30);
      addChestnut(x + 292, groundY - 34, .9);
    }
    nextPattern += 225 + Math.random() * 55;
  }
"""
          new_rush = """  function spawnRushPattern() {
    const x = W + 85;
    const kind = Math.floor(Math.random() * 5);
    if (kind === 0) {
      addChestnut(x, groundY - 33, .86);
      addChestnut(x + 108, groundY - 37, 1.0);
      addChestnut(x + 220, groundY - 33, .9);
    } else if (kind === 1) {
      addChestnut(x, groundY - 33, .9);
      addChestnut(x + 125, groundY - 50, 1.18);
      addChestnut(x + 245, groundY - 33, .9);
    } else if (kind === 2) {
      addPlatform(x + 52, groundY - 82, 150);
      addChestnut(x, groundY - 33, .86);
      addChestnut(x + 225, groundY - 34, .96);
    } else if (kind === 3) {
      addChestnut(x, groundY - 33, .84);
      addChestnut(x + 115, groundY - 33, .88);
      addChestnut(x + 235, groundY - 42, 1.04);
    } else {
      addChestnut(x, groundY - 34, .94);
      addChestnut(x + 132, groundY - 34, .88);
      addChestnut(x + 260, groundY - 52, 1.18);
    }
    nextPattern += 315 + Math.random() * 70;
  }
"""
          rep(old_rush, new_rush, 'rush patterns')

          rep("""    eventTimer = type === 'rush' ? 8.0 : 8.5;
""", """    eventTimer = type === 'rush' ? 7.0 : 8.5;
""", 'rush duration')

          rep("""    nextPattern = Math.min(nextPattern, distance + W + (type === 'rush' ? 85 : 150));
""", """    nextPattern = Math.min(nextPattern, distance + W + (type === 'rush' ? 175 : 150));
""", 'rush lead in')

          path.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit tuned KURI RUSH
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js
          git commit -m "gameplay: make KURI RUSH challenging but fair"
          git push
