name: Soften KURI RUSH

on:
  push:
    paths:
      - '.github/workflows/soften-kuri-rush.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune KURI RUSH
        run: |
          sed -i "s/eventMode === 'rush' ? 48 : eventMode === 'bonus' ? 12 : 0/eventMode === 'rush' ? 20 : eventMode === 'bonus' ? 12 : 0/" game.js
          sed -i "s/Math.min(555, 275 + distance \* .0062/Math.min(540, 275 + distance * .0062/" game.js
          sed -i "s/nextPattern += 225 + Math.random() \* 55;/nextPattern += 315 + Math.random() * 70;/" game.js
          sed -i "s/eventTimer = type === 'rush' ? 8.0 : 8.5;/eventTimer = type === 'rush' ? 7.0 : 8.5;/" game.js
          sed -i "s/type === 'rush' ? 85 : 150/type === 'rush' ? 175 : 150/" game.js
          sed -i "/addChestnut(x + 214, groundY - 39, 1.06);/d" game.js
          sed -i "/addChestnut(x + 252, groundY - 33, .86);/d" game.js
          sed -i "/addChestnut(x + 292, groundY - 34, .9);/d" game.js
          node --check game.js
      - name: Commit
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js
          git commit -m "gameplay: make KURI RUSH beatable"
          git push
