name: Add KURI RUSH warp effect

on:
  push:
    paths:
      - '.github/workflows/add-rush-warp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply warp patch
        run: python3 .github/scripts/add_rush_warp.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit warp effect
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html
          git commit -m "effect: add warp transition into KURI RUSH"
          git push
