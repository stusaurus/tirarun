name: Character level benefits

on:
  push:
    paths:
      - '.github/workflows/character-level-benefits.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply character level benefit patch
        run: python .github/scripts/character_level_benefits.py
      - name: Check game syntax
        run: node --check game.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html style.css
          git diff --cached --quiet || git commit -m "feat: make character levels meaningful"
          git push
