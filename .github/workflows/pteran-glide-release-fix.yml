name: Pteran glide release fix

on:
  push:
    paths:
      - '.github/workflows/pteran-glide-release-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply glide release fix
        run: python .github/scripts/pteran_glide_release_fix.py
      - name: Check syntax
        run: node --check game.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git diff --cached --quiet || git commit -m "fix: keep UI clicks working with glide release"
          git push
