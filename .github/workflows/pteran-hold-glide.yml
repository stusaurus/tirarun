name: Pteran hold glide

on:
  push:
    paths:
      - '.github/workflows/pteran-hold-glide.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hold-to-glide patch
        run: python .github/scripts/pteran_hold_glide.py
      - name: Check game syntax
        run: node --check game.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html style.css
          git diff --cached --quiet || git commit -m "feat: add controllable Pteran glide"
          git push
