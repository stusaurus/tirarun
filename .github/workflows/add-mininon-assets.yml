name: Add Mininon assets

on:
  push:
    paths:
      - '.github/workflows/add-mininon-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Mininon patch
        run: python .github/scripts/add_mininon_assets.py
      - name: Check game syntax
        run: node --check game.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git diff --cached --quiet || git commit -m "feat: add Mininon playable animations"
          git push
