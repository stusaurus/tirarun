name: Fix progression HUD

on:
  push:
    paths:
      - '.github/workflows/add-progression-shop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix progression HUD
        run: python3 .github/scripts/fix_progression_hud.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit progression HUD fix
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js
          git commit -m "fix: settle run coins and initialize shop HUD"
          git push
# rerun-v2
