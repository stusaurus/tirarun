name: Add character system

on:
  push:
    paths:
      - '.github/workflows/add-character-system.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add character system
        run: python3 .github/scripts/add_character_system.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit character system
        run: |
          git config user.name "stusaurus"
          git config user.email "kiyo0625puma@yahoo.co.jp"
          git add game.js index.html style.css
          git commit -m "feat: add character selection and character levels"
          git push
