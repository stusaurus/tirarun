<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#dff7ef" />
  <title>ティラクリ | ワンタップラン</title>
  <link rel="stylesheet" href="./style.css?v=20260913-2014" />
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="ティラクリ ワンタップランゲーム"></canvas>

  <div id="hud">
    <div class="stat">
      <small>SCORE / BEST</small>
      <strong id="score">0</strong> <span id="best">/ 0</span>
      <div id="coinHud">🪙 0</div>
    </div>
    <div id="rightHud">
      <div id="letters">T I R A K U R I</div>
      <button id="mute" aria-label="サウンド切替">🔊</button>
    </div>
  </div>

  <div id="itemBar">
    <div class="buff" id="shieldBuff">🛡 シールド</div>
    <div class="buff" id="magnetBuff">🧲 マグネット</div>
    <div class="buff" id="giantBuff">⬆ 巨大化</div>
    <div class="buff" id="feverBuff">🔥 FEVER ×3</div>
  </div>

  <div id="overlay">
    <div id="card">
      <h1>ティラ<span class="kuri">クリ</span></h1>
      <div id="subtitle">ワンタップで、どこまでいける？</div>
      <div id="result"></div>
      <div id="message">
        ティラノンは自動で走るノン！<br>
        タップでジャンプ、空中でもう1回タップで<strong>2段ジャンプ</strong>。<br>
        栗をよけてハイスコアをねらおう。
      </div>
      <div id="menuBtns">
        <button id="startBtn">タップしてスタート</button>
        <button id="shopBtn">🛒 ショップ</button>
      </div>
      <div id="tips">
        コインを集めて新アイテムを購入・強化！<br>
        アイテムは最大5つまで装備できるノン
      </div>
    </div>
    <div id="shopPanel" hidden>
      <div class="shopHead">
        <div><strong>ティラクリショップ</strong><small id="shopSlots">装備 3 / 5</small></div>
        <div><span id="shopCoins">🪙 0</span><button id="shopCloseBtn" aria-label="ショップを閉じる">×</button></div>
      </div>
      <div id="shopItems"></div>
      <div id="shopNote"></div>
    </div>
  </div>
</div>
<script src="./theme.js?v=20260913-2014"></script>
<script src="./visibility.js?v=20260913-2014"></script>
<script src="./contrast.js?v=20260913-2014"></script>
<script src="./game.js?v=20260913-2014"></script>
</body>
</html>
