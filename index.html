<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#dff7ef" />
  <title>ティラクリ | ワンタップラン</title>
  <link rel="stylesheet" href="./style.css?v=20260913-1638" />
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="ティラクリ ワンタップランゲーム"></canvas>

  <div id="hud">
    <div class="stat">
      <small>SCORE / BEST</small>
      <strong id="score">0</strong> <span id="best">/ 0</span>
    </div>
    <div id="rightHud">
      <div id="letters">T I R A K U R I</div>
      <button id="mute" aria-label="サウンド切替">🔊</button>
    </div>
  </div>

  <div id="itemBar">
    <div class="buff" id="shieldBuff">🛡 シールド</div>
    <div class="buff" id="magnetBuff">🧲 マグネット</div>
    <div class="buff" id="giantBuff">⬆ 巨大化</div>
    <div class="buff" id="feverBuff">🔥 FEVER ×3</div>
  </div>

  <div id="overlay">
    <div id="card">
      <h1>ティラ<span class="kuri">クリ</span></h1>
      <div id="subtitle">ワンタップで、どこまでいける？</div>
      <div id="result"></div>
      <div id="message">
        ティラノンは自動で走るノン！<br>
        タップでジャンプ、空中でもう1回タップで<strong>2段ジャンプ</strong>。<br>
        栗をよけてハイスコアをねらおう。
      </div>
      <button id="startBtn">タップしてスタート</button>
      <div id="tips">
        栗を連続でよけるとCOMBO！ギリギリ回避は高得点。<br>
        KURI RUSH / BONUS RUN / ジャンプ台も出現
      </div>
    </div>
  </div>
</div>
<script src="./theme.js?v=20260913-1638"></script>
<script src="./visibility.js?v=20260913-1638"></script>
<script src="./contrast.js?v=20260913-1638"></script>
<script src="./game.js?v=20260913-1638"></script>
</body>
</html>
